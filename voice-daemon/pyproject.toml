[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Jarvis's always-listening voice daemon: wake-word detection, ambient transcription, memory, and spoken replies."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "psutil>=7.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "edge-tts>=7.0",
    "faster-whisper>=1.2",
    "kokoro-onnx>=0.5",
    "openwakeword>=0.6",
    "pvporcupine>=4.0",
    "sentence-transformers>=5.0",
    "sherpa-onnx>=1.13",
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyobjc-core>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Only needed for jarvis_pipecat.py, the open-channel conversation-mode
# pipeline. The core wake-word daemon (jarvis_ear.py) doesn't need it.
pipecat = ["pipecat-ai>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]
