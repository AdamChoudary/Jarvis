<!DOCTYPE html>
<html lang="en">
<title>Jarvis</title>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230A0C11'/%3E%3Ccircle cx='8' cy='8' r='3.4' fill='%23E8B657'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --void: #0A0C11;
    --void-edge: #06070A;
    --ink: #E8E9EC;
    --ink-dim: #9497A0;
    --ink-faint: #5C5F68;
    --hair: rgba(255,255,255,0.10);
    --highlight: rgba(255,255,255,0.06);
    --glass: rgba(18,20,26,0.55);
    --amber: #E8B657;
    --amber-dim: rgba(232,182,87,0.35);
    --c-opencode: #5FA3A0;   /* cool teal */
    --c-vault:    #8E86C9;   /* soft violet */
    --c-context:  #6E9E7C;   /* muted green */
    --c-voice:    #7C89A6;   /* pale slate-blue */
    --radius: 13px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--void); color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  #graph { position: fixed; inset: 0; display: block; }

  .panel {
    position: fixed;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    box-shadow: 0 1px 0 var(--highlight) inset, 0 18px 40px rgba(0,0,0,0.35);
    padding: 16px 18px;
  }

  /* ── Helm (top-left): identity + vitals ───────────────────────────── */
  #helm { top: 22px; left: 22px; width: 248px; }
  #helm .row1 { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  #pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 6px var(--amber-dim);
    animation: breathe 4s ease-in-out infinite;
  }
  /* amber only means "awake" — an offline/unreachable daemon must not breathe */
  #pulse.still {
    background: var(--ink-faint); box-shadow: none; animation: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1); }
  }
  #helm .title { font-size: 14px; font-weight: 500; letter-spacing: 0.02em;
                 color: var(--ink); margin: 0; }
  #helm .sub   { font-size: 11px; color: var(--ink-dim); margin-left: auto; }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px;
        padding: 3.5px 0; border-top: 1px solid var(--hair); }
  .kv:first-of-type { border-top: none; }
  .kv .k { color: var(--ink-dim); }
  .kv .v { color: var(--ink); min-width: 0; white-space: nowrap; }
  #spark { width: 100%; height: 30px; margin-top: 10px; display: block; }
  #kgnote { font-size: 10px; color: var(--ink-dim); margin-top: 8px; }

  /* ── Log rail (right edge): Today / Projects / Ideas ─────────────── */
  #log { top: 22px; right: 22px; bottom: 22px; width: 288px;
         overflow-y: auto; padding: 0; }
  #log::-webkit-scrollbar { width: 0; }
  .section { padding: 15px 18px; }
  .section + .section { border-top: 1px solid var(--hair); }
  .section h2 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--ink-dim); margin: 0 0 10px 0; font-weight: 500;
  }
  .item { font-size: 12px; padding: 5px 0; }
  .item .l1 { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); }
  .item .l2 { display: flex; justify-content: space-between; gap: 8px;
              color: var(--ink-dim); font-size: 10.5px; margin-top: 1px; }
  .status-ok   { color: var(--ink-dim); }
  .status-fail { color: #C98A6E; }
  .status-off  { color: var(--ink-dim); }
  /* amber is reserved for the live pulse + active node only; lifecycle
     status reads through ink brightness instead */
  .life-spark      { color: var(--ink-dim); }
  .life-exploring  { color: var(--ink-dim); }
  .life-validated  { color: var(--ink); }
  .life-promoted   { color: var(--ink); }
  .life-parked     { color: var(--ink-dim); text-decoration: line-through; }

  /* ── Slate: file inspector ────────────────────────────────────────── */
  #slate {
    position: fixed; left: 22px; right: 328px; bottom: 22px;
    max-height: 46vh; transform: translateY(calc(100% + 22px));
    transition: transform 380ms cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; padding: 0;
  }
  #slate.open { transform: translateY(0); }
  #slate .head { display: flex; align-items: center; gap: 10px;
                 padding: 14px 18px; border-bottom: 1px solid var(--hair); }
  #slate .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  #slate .t { font-size: 13px; color: var(--ink); }
  #slate .p { font-size: 10.5px; color: var(--ink-dim); margin-left: auto; }
  #slate .close {
    cursor: pointer; color: var(--ink-dim); font-size: 16px; padding: 2px 8px;
    background: none; border: none; border-radius: 6px; font: inherit; line-height: 1;
  }
  #slate .close:hover { color: var(--ink); }
  #slate .body { padding: 14px 18px; overflow-y: auto; font-size: 12px;
                 line-height: 1.6; color: var(--ink-dim); white-space: pre-wrap; }

  #veil { position: fixed; inset: 0; background: rgba(0,0,0,0);
          transition: background 380ms; pointer-events: none; }
  #veil.open { background: rgba(0,0,0,0.25); pointer-events: auto; }

  :focus-visible {
    outline: 1.5px solid var(--ink-dim); outline-offset: 2px; border-radius: 4px;
  }
  ::selection { background: rgba(148,151,160,0.35); }

  @media (prefers-reduced-motion: reduce) {
    #pulse { animation: none; opacity: 0.9; }
    #slate, #veil { transition: none; }
  }
</style>

<canvas id="graph"></canvas>
<div id="veil"></div>

<aside class="panel" id="helm" aria-label="Vitals">
  <div class="row1">
    <div id="pulse" aria-hidden="true"></div>
    <h1 class="title">Jarvis</h1>
    <div class="sub mono" id="daemon-state">-</div>
  </div>
  <div class="kv"><span class="k">Uptime</span><span class="v mono" id="v-uptime">-</span></div>
  <div class="kv"><span class="k">Brain latency</span><span class="v mono" id="v-latency">-</span></div>
  <div class="kv"><span class="k">Exchanges</span><span class="v mono" id="v-exchanges">-</span></div>
  <div class="kv"><span class="k">Process / unified</span><span class="v mono" id="v-ram">-</span></div>
  <svg id="spark" preserveAspectRatio="none"></svg>
  <div id="kgnote" class="mono"></div>
</aside>

<aside class="panel" id="log" aria-label="Today, projects and ideas">
  <section class="section">
    <h2>Today</h2>
    <div id="crons"></div>
  </section>
  <section class="section">
    <h2>Projects</h2>
    <div id="projects"></div>
  </section>
  <section class="section">
    <h2>Ideas</h2>
    <div id="ideas"></div>
  </section>
</aside>

<section class="panel" id="slate" aria-label="File inspector">
  <div class="head">
    <div class="dot" id="slate-dot" aria-hidden="true"></div>
    <div class="t mono" id="slate-title">-</div>
    <div class="p mono" id="slate-path">-</div>
    <button class="close" id="slate-close" aria-label="Close">&#215;</button>
  </div>
  <div class="body" id="slate-body">-</div>
</section>

<script>
(function () {
  "use strict";

  var CLUSTER_COLOR = {
    opencode: getVar("--c-opencode"),
    vault:    getVar("--c-vault"),
    context:  getVar("--c-context"),
    voice:    getVar("--c-voice"),
  };
  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function hexToRgb(hex) {
    var n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }

  // ── Canvas + viewport ────────────────────────────────────────────────
  var canvas = document.getElementById("graph");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layoutClusters();
  }
  window.addEventListener("resize", resize);

  // node mass weighted upper-center-left; keep clear of the Helm (top-left)
  // and Log rail (right edge); lower-center stays open to breathe.
  var CLUSTERS = ["opencode", "vault", "context", "voice"];
  var clusterAnchor = {};
  var clusterCage = {};       // per-cluster radius, scaled to how many docs it holds
  function layoutClusters() {
    // upper-center-left mass, clear of the Helm panel's footprint (top-left
    // ~300x280) and the Log rail (right ~310); lower-center stays open
    var cx = W * 0.42, cy = H * 0.38;
    var rx = Math.min(W * 0.20, 210), ry = Math.min(H * 0.17, 150);
    var angles = [210, 300, 150, 20]; // tight arc, all within the upper-left mass
    CLUSTERS.forEach(function (name, i) {
      var a = angles[i] * Math.PI / 180;
      clusterAnchor[name] = { x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry };
    });
  }

  // ── State ────────────────────────────────────────────────────────────
  var nodes = [];
  var selected = null;
  var frame = 0;
  var REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function seedNodes(rawNodes) {
    var counts = {};
    rawNodes.forEach(function (n) { counts[n.source] = (counts[n.source] || 0) + 1; });
    CLUSTERS.forEach(function (c) {
      clusterCage[c] = 34 + 6 * Math.sqrt(counts[c] || 1); // bigger clusters get more room
    });
    nodes = rawNodes.map(function (n) {
      var anchor = clusterAnchor[n.source] || { x: W / 2, y: H / 2 };
      var cage = clusterCage[n.source] || 60;
      var a = Math.random() * Math.PI * 2, r = Math.random() * cage;
      return {
        id: n.id, source: n.source, title: n.title,
        x: anchor.x + Math.cos(a) * r, y: anchor.y + Math.sin(a) * r,
        vx: 0, vy: 0, radius: 2.1,
      };
    });
  }

  // ── Physics: settle fast, then cheap ambient drift ──────────────────
  function step() {
    var full = frame < 260 || frame % 3 === 0; // throttle after ~4.3s @60fps
    var n = nodes.length;

    if (full) {
      for (var i = 0; i < n; i++) {
        var a = nodes[i], fx = 0, fy = 0;
        for (var j = 0; j < n; j++) {
          if (i === j) continue;
          var b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var d2 = dx * dx + dy * dy + 0.01;
          if (d2 > 484) continue; // beyond ~22px, no repulsion — this is a
          var f = 16 / d2;         // personal-space nudge, not a gas that
          fx += dx * f; fy += dy * f;   // inflates the whole cluster outward
        }
        var anchor = clusterAnchor[a.source];
        fx += (anchor.x - a.x) * 0.03;
        fy += (anchor.y - a.y) * 0.03;
        a.vx = (a.vx + fx) * 0.82;
        a.vy = (a.vy + fy) * 0.82;
      }
    } else {
      // ambient drift only: gentle pull home + tiny jitter, O(n) — the jitter
      // is exactly the "continuous drift" reduced-motion users are opting out of
      var jitter = REDUCE_MOTION ? 0 : 0.05;
      for (var k = 0; k < n; k++) {
        var nd = nodes[k], an = clusterAnchor[nd.source];
        nd.vx = (nd.vx + (an.x - nd.x) * 0.01 + (Math.random() - 0.5) * jitter) * 0.9;
        nd.vy = (nd.vy + (an.y - nd.y) * 0.01 + (Math.random() - 0.5) * jitter) * 0.9;
      }
    }
    for (var m = 0; m < n; m++) {
      var nd2 = nodes[m];
      nd2.x += nd2.vx;
      nd2.y += nd2.vy;
      // soft-then-hard cage, sized per cluster: a lone node keeps its personal
      // space small while a 270-doc cluster gets real room, so nothing gets
      // squeezed against a boundary into an artificial ring
      var an2 = clusterAnchor[nd2.source], cage = clusterCage[nd2.source] || 60;
      var dx2 = nd2.x - an2.x, dy2 = nd2.y - an2.y;
      var dist = Math.hypot(dx2, dy2);
      if (dist > cage) {
        var k2 = cage / dist;
        nd2.x = an2.x + dx2 * k2;
        nd2.y = an2.y + dy2 * k2;
      }
    }
    frame++;
  }

  function centroids() {
    var acc = {};
    CLUSTERS.forEach(function (c) { acc[c] = { x: 0, y: 0, n: 0 }; });
    nodes.forEach(function (nd) {
      var a = acc[nd.source]; if (!a) return;
      a.x += nd.x; a.y += nd.y; a.n++;
    });
    return acc;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // real KG relations, if any exist yet — honest: nothing drawn while empty
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    (window.__kgRelations || []).forEach(function (r) {
      var s = byId[r.source], t = byId[r.target];
      if (!s || !t) return;
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y); ctx.stroke();
    });

    nodes.forEach(function (n) {
      var isSel = selected && selected.id === n.id;
      var color = CLUSTER_COLOR[n.source] || "#7C89A6";
      var rgb = isSel ? "242,228,200" : hexToRgb(color).join(",");
      var r = (isSel ? n.radius + 1.4 : n.radius) * 2.4;
      // soft falloff star-point, not a flat disc or a bloom-glow orb
      var grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r);
      grad.addColorStop(0, "rgba(" + rgb + "," + (isSel ? 0.95 : 0.85) + ")");
      grad.addColorStop(0.5, "rgba(" + rgb + "," + (isSel ? 0.55 : 0.32) + ")");
      grad.addColorStop(1, "rgba(" + rgb + ",0)");
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      if (isSel) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + 5, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(232,182,87,0.75)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    });

    if (selected) {
      ctx.font = "11px ui-monospace, SF Mono, monospace";
      ctx.fillStyle = "rgba(242,228,200,0.9)";
      ctx.fillText(selected.title, selected.x + 10, selected.y - 8);
    }

    // low-opacity constellation captions
    var cent = centroids();
    ctx.font = "11px ui-monospace, SF Mono, monospace";
    CLUSTERS.forEach(function (c) {
      var a = cent[c]; if (!a || !a.n) return;
      ctx.fillStyle = rgba(CLUSTER_COLOR[c], 0.75);
      ctx.fillText(c + " · " + a.n, a.x / a.n, a.y / a.n - 14);
    });
  }

  function loop() {
    step();
    draw();
    // reduced-motion: the graph has settled and jitter is off, so there is
    // nothing to redraw every 16ms — idle at a cheap cadence instead
    if (REDUCE_MOTION && frame > 260) {
      setTimeout(function () { requestAnimationFrame(loop); }, 400);
    } else {
      requestAnimationFrame(loop);
    }
  }

  // ── Selection / hit-test ────────────────────────────────────────────
  canvas.addEventListener("click", function (e) {
    var x = e.clientX, y = e.clientY, hit = null, best = 100;
    nodes.forEach(function (n) {
      var d = Math.hypot(n.x - x, n.y - y);
      if (d < best) { best = d; hit = n; }
    });
    if (hit && best < 14) selectNode(hit); else if (hit === null) closeSlate();
  });

  var slate = document.getElementById("slate");
  var veil = document.getElementById("veil");

  function selectNode(n) {
    selected = n;
    document.getElementById("slate-dot").style.background =
      CLUSTER_COLOR[n.source] || "#7C89A6";
    document.getElementById("slate-title").textContent = n.title;
    document.getElementById("slate-path").textContent = n.source;
    document.getElementById("slate-body").textContent = "Loading...";
    slate.classList.add("open"); veil.classList.add("open");
    fetch("/api/doc?id=" + encodeURIComponent(n.id))
      .then(function (r) { return r.json(); })
      .then(function (doc) {
        document.getElementById("slate-path").textContent = doc.path || doc.source || "";
        document.getElementById("slate-body").textContent = doc.content || "(empty)";
      })
      .catch(function () {
        document.getElementById("slate-body").textContent = "Could not load this file.";
      });
  }
  function closeSlate() {
    selected = null;
    slate.classList.remove("open"); veil.classList.remove("open");
  }
  document.getElementById("slate-close").addEventListener("click", closeSlate);
  veil.addEventListener("click", closeSlate);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSlate();
  });

  // ── Log rail rendering (DOM construction, not innerHTML — this reads
  // straight from vault notes and job names, so never trust it as markup) ──
  function el(tag, opts) {
    var e = document.createElement(tag);
    if (opts.cls) e.className = opts.cls;
    if (opts.text != null) e.textContent = opts.text;
    return e;
  }
  function row(l1Left, l1Right, l1RightCls, l2Left, l2Right) {
    var div = el("div", { cls: "item" });
    var l1 = el("div", { cls: "l1" });
    l1.appendChild(el("span", { text: l1Left }));
    l1.appendChild(el("span", { cls: "mono " + l1RightCls, text: l1Right }));
    div.appendChild(l1);
    if (l2Left != null || l2Right != null) {
      var l2 = el("div", { cls: "l2 mono" });
      l2.appendChild(el("span", { text: l2Left || "" }));
      l2.appendChild(el("span", { text: l2Right || "" }));
      div.appendChild(l2);
    }
    return div;
  }
  function renderCrons(list) {
    var container = document.getElementById("crons");
    container.innerHTML = "";
    (list || []).forEach(function (j) {
      var ok = j.last_status === "ok";
      container.appendChild(row(
        j.name, j.last_status || "-", ok ? "status-ok" : "status-fail",
        j.schedule || "", j.completed != null ? j.completed + "x" : ""));
    });
  }
  function renderProjects(list) {
    var container = document.getElementById("projects");
    container.innerHTML = "";
    (list || []).forEach(function (p) {
      container.appendChild(row(
        p.name, p.status || "", "status-" + (p.status === "active" ? "ok" : "off")));
    });
  }
  function renderIdeas(list) {
    var container = document.getElementById("ideas");
    container.innerHTML = "";
    (list || []).forEach(function (idea) {
      container.appendChild(row(idea.name, idea.status || "", "life-" + (idea.status || "")));
    });
  }

  // ── Sparkline ────────────────────────────────────────────────────────
  function renderSpark(trend) {
    var svg = document.getElementById("spark");
    var w = svg.clientWidth || 216, h = 30;
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    if (!trend || !trend.length) { svg.innerHTML = ""; return; }
    var vals = trend.map(function (t) { return t.rss_mb; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = Math.max(max - min, 1);
    var pts = vals.map(function (v, i) {
      var x = (i / (vals.length - 1 || 1)) * w;
      var y = h - ((v - min) / span) * (h - 4) - 2;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    svg.innerHTML =
      '<polyline points="' + pts + '" fill="none" stroke="' + getVar("--ink-dim") +
      '" stroke-opacity="0.75" stroke-width="1.2"/>';
  }

  // ── Poll the data endpoint ───────────────────────────────────────────
  var firstLoad = true;
  function fmtSecs(s) {
    if (s == null) return "-";
    return s < 60 ? s.toFixed(1) + "s" : (s / 60).toFixed(1) + "m";
  }
  function poll() {
    fetch("/api/snapshot").then(function (r) { return r.json(); }).then(function (snap) {
      document.getElementById("daemon-state").textContent =
        snap.daemon_alive ? "awake" : "offline";
      document.getElementById("pulse").classList.toggle("still", !snap.daemon_alive);
      document.getElementById("v-uptime").textContent =
        snap.vitals.uptime_hours != null ? snap.vitals.uptime_hours + "h" : "-";
      document.getElementById("v-latency").textContent =
        fmtSecs(snap.vitals.latency_last_secs);
      document.getElementById("v-exchanges").textContent =
        snap.today.exchanges_since_boot + " since boot";
      var trend = snap.vitals.ram_trend || [];
      var lastFp = null;
      for (var i = trend.length - 1; i >= 0; i--) {
        if (trend[i].footprint_mb != null) { lastFp = trend[i].footprint_mb; break; }
      }
      var lastRss = trend.length ? trend[trend.length - 1].rss_mb : null;
      document.getElementById("v-ram").textContent =
        (lastRss != null ? lastRss + "MB" : "-") + " / " + (lastFp != null ? lastFp + "MB" : "-");
      renderSpark(trend);

      renderCrons(snap.today.crons);
      renderProjects(snap.projects);
      renderIdeas(snap.ideas);

      var kgN = (snap.graph.kg_entities || []).length;
      document.getElementById("kgnote").textContent =
        "constellations: " + CLUSTERS.length + " · relations: " +
        (kgN ? kgN + " indexed" : "none yet");

      window.__kgRelations = snap.graph.kg_relations || [];

      if (firstLoad) {
        firstLoad = false;
        resize();
        seedNodes(snap.graph.nodes || []);
        loop();
      }
    }).catch(function () {
      document.getElementById("daemon-state").textContent = "unreachable";
      document.getElementById("pulse").classList.add("still");
    });
  }

  resize();
  poll();
  setInterval(poll, 8000);
})();
</script>
</html>
